# =============================================================================
# traefik.yml — Configuración estática de Traefik v3
# =============================================================================

global:
  checkNewVersion: false      # No enviar datos a traefik.io
  sendAnonymousUsage: false   # Privacidad — Ley 1581

# ---------------------------------------------------------------------------
# API y Dashboard
# ---------------------------------------------------------------------------
api:
  dashboard: true
  insecure: false   # Dashboard sólo accesible mediante HTTPS + auth

# ---------------------------------------------------------------------------
# ENTRYPOINTS
# ---------------------------------------------------------------------------
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        options: modern   # Política TLS definida en dynamic.yml
    http3:
      advertisedPort: 443   # HTTP/3 (QUIC) — mejora rendimiento

# ---------------------------------------------------------------------------
# PROVEEDORES
# ---------------------------------------------------------------------------
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false   # SEGURIDAD: sólo servicios con label explícito
    network: fintech_public
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

# ---------------------------------------------------------------------------
# CERTIFICADOS TLS — Let's Encrypt (ACME)
# ---------------------------------------------------------------------------
certificatesResolvers:
  letsencrypt:
    acme:
      email: "${LETSENCRYPT_EMAIL}"
      storage: /letsencrypt/acme.json
      # TLS Challenge (por defecto). Alternativa: httpChallenge o dnsChallenge.
      tlsChallenge: {}
      # Para DNS Challenge (wildcard certs, más seguro):
      # dnsChallenge:
      #   provider: cloudflare
      #   resolvers:
      #     - "1.1.1.1:53"
      #     - "8.8.8.8:53"

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
log:
  level: INFO
  filePath: /var/log/traefik/traefik.log

accessLog:
  filePath: /var/log/traefik/access.log
  bufferingSize: 100
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop     # No loguear cabeceras (pueden contener datos sensibles)
      names:
        User-Agent: keep
        X-Forwarded-For: keep
