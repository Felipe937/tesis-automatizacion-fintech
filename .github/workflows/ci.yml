name: CI — excel-reconciler

on:
  push:
    paths:
      - 'services/excel-reconciler/**'
  pull_request:
    paths:
      - 'services/excel-reconciler/**'

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/excel-reconciler

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: services/excel-reconciler/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
